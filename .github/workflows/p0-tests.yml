name: P0 Windows regression
on:
  push:
    branches: ["codex/p0-stability"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Project dependencies
        run: python -m pip install -r requirements.txt
      - name: Portable test tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-build
          New-Item -ItemType Directory -Force tools | Out-Null
          Get-ChildItem ffmpeg-build -Recurse -Filter *.exe | Where-Object { $_.Name -in @('ffmpeg.exe','ffprobe.exe') } | Copy-Item -Destination tools
      - name: Unit and synthetic file export regression
        run: python -B -m unittest discover -s tests -v
